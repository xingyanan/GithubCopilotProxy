<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Copilot Proxy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

      <span>Copilot Proxy</span>

    <div class="top-right">
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="home"></button>

        <button role="tab" data-tab="settings"></button>
      </nav>
      <button class="lang" id="langBtn" type="button">EN</button>

  <main id="view" class="view"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
